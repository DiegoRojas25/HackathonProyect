<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TacoLoco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <section class="productos py-5">

        <div class="container">
            <h2 class="mb-5">Nuestros platillos</h2>
            <div id="catalogoProductos" class="row g-4"></div>
        </div>

    </section>


    <section class="historia">
        <div class="container">
            <div class="row align-items-center">

                <div class="col-lg-6 ">
                    <img src="./img/restaurante.png" alt="Foto frontal del restaurante" class="img-fluid historia-img">
                </div>

                <div class="col-lg-6 py-4">
                    <h1>Nuestra historia</h1>
                    <p>TacoLoco nace de la pasion por la autentica comida mexicana y el deseo
                        de compartir sabores que
                        nos conectan con nuestras raices. Usamos ingredientes frescos, apotamos a productores locales y
                        cocinamos cada platillo con amor y dedicación.</p>
                </div>

            </div>
        </div>
    </section>


    <script src="./app.js"></script>
</body>

</html>
