<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles.css">
    <title>Inicio</title>
</head>
<body>
    <header>
        <nav id="nav" class="navbar navbar-expand-lg bg-body-tertiary px-4 py-2">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img class="logo" src="../img/logoSinFondo.png" alt="Logo TacoLoco" width="100" height="auto">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-3">
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#">Categorias</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#">Productos</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#">Nosotros</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#">Equipo</a>
                    </li>
                    <li class="nav-item d-flex align-items-center gap-2">
                        <button id="mostrarCarrito" class="btn btn-outline-success btn-lg d-flex align-items-center gap-1 text-white  btn-carrito" type="submit">
                            <i class="bi bi-cart4 me-2"></i>
                            <span>Carrito</span>
                            <span>(0)</span>
                        </button>
                    </li>
                </ul>
                </div>
            </div>
            </nav>
    </header>

    <main>
        <div id="overlay" class="d-none">
            <section id="carrito">

                <div class="carrito-header">
                    <h2>Carrito de compras</h2>
                    <button id="cerrarCarrito" class="btn-cerrar">
                        <i class="bi bi-box-arrow-left"></i>
                    </button>
                </div>

                <div class="carrito-body">

                    <div id="productos-carrito" class="productos-carrito">

                    </div>

                    <aside class="resumen-carrito">
                        <div class="info-carrito">
                            <h4>Productos</h4>
                            <span id="cantidadProductos">0</span>
                        </div>

                        <div class="info-carrito">
                            <h4>Total</h4>
                            <span id="totalCarrito">$0</span>
                        </div>

                        <button class="btn-comprar">
                            Confirmar compra
                        </button>
                    </aside>
                </div>
            </section>
        </div>
        


    </main>


    <script src="../app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
